#pragma once

#include "Logger.h"
#include <chrono>
#include <ctime>
#include <format>
#include <iostream>
#include <sstream>

// 平台相关的控制台颜色支持：
//   - Windows：使用 Win32 API（<Windows.h> / SetConsoleTextAttribute）
//   - Linux / 其它 POSIX：使用 ANSI 转义码
#ifdef _WIN32
    #include <Windows.h>

    constexpr WORD GREEN  = 2;
    constexpr WORD RED    = 4;
    constexpr WORD YELLOW = 6;
    constexpr WORD WHITE  = 7;

    // 设置 Windows 控制台文字颜色
    inline void ApplyColor(WORD color)
    {
        HANDLE hConsole = GetStdHandle(STD_OUTPUT_HANDLE);
        SetConsoleTextAttribute(hConsole, color);
    }

    // 恢复默认颜色（Windows 下用 WHITE，等价于重置为初始前景色）
    inline void ResetColor()
    {
        HANDLE hConsole = GetStdHandle(STD_OUTPUT_HANDLE);
        SetConsoleTextAttribute(hConsole, WHITE);
    }
#else
    // Linux 下使用 ANSI 转义码（\033[...m）。
    // 30/31/32/33 分别对应 黑/红/绿/黄 前景色。
    constexpr const char* COLOR_GREEN  = "\033[32m";
    constexpr const char* COLOR_RED    = "\033[31m";
    constexpr const char* COLOR_YELLOW = "\033[33m";
    constexpr const char* COLOR_RESET  = "\033[0m";

    inline void ApplyColor(const char* ansiCode)
    {
        std::cout << ansiCode;
    }

    inline void ResetColor()
    {
        std::cout << COLOR_RESET;
    }
#endif

namespace NEXUS_LOGGER {

    template <typename... Args>
    void Logger::Log(const std::string& message, Args&&... args)
    {
        assert(m_bInitialized && "必须先对日志记录器初始化，才能使用！");

        if (!m_bInitialized)
        {
            std::cout << "必须先对日志记录器初始化，才能使用！" << std::endl;
            return;
        }

        std::stringstream ss;
        ss << "NEXUS [INFO]: " << CurrentDateTime() << " - " << std:: vformat(message, std::make_format_args(std::forward<Args>(args)...)) << "\n";

        if (m_bConsoleLog)
        {
#ifdef _WIN32
            ApplyColor(GREEN);
#else
            ApplyColor(COLOR_GREEN);
#endif
            std::cout << ss.str();
            ResetColor();
        }

        if (m_bRetainLogs)
            m_LogEntries.emplace_back(LogEntry::LogType::INFO, ss.str());

    }

    template <typename... Args>
    void Logger::Warn(const std::string& message, Args&&... args)
    {
        assert(m_bInitialized && "必须先对日志记录器初始化，才能使用！");

        if (!m_bInitialized)
        {
            std::cout << "必须先对日志记录器初始化，才能使用！" << std::endl;
            return;
        }

        std::stringstream ss;
        ss << "NEXUS [WARN]: " << CurrentDateTime() << " - " << std:: vformat(message, std::make_format_args(std::forward<Args>(args)...)) << "\n";

        if (m_bConsoleLog)
        {
#ifdef _WIN32
            ApplyColor(YELLOW);
#else
            ApplyColor(COLOR_YELLOW);
#endif
            std::cout << ss.str();
            ResetColor();
        }

        if (m_bRetainLogs)
            m_LogEntries.emplace_back(LogEntry::LogType::WARN, ss.str());

    }

    template <typename... Args>
    void Logger::Error(std::source_location location, const std::string& message, Args&&... args)
    {
        assert(m_bInitialized && "必须先对日志记录器初始化，才能使用！");

        if (!m_bInitialized)
        {
            std::cout << "必须先对日志记录器初始化，才能使用！" << std::endl;
            return;
        }

        std::stringstream ss;
        ss << "NEXUS [ERROR]: " << CurrentDateTime() << " - " << std:: vformat(message, std::make_format_args(std::forward<Args>(args)...)) <<
            "\nFUNC: " << location.function_name() <<
            "\nLINE: " << location.line() << "\n\n";

        if (m_bConsoleLog)
        {
#ifdef _WIN32
            ApplyColor(RED);
#else
            ApplyColor(COLOR_RED);
#endif
            std::cout << ss.str();
            ResetColor();
        }

        if (m_bRetainLogs)
            m_LogEntries.emplace_back(LogEntry::LogType::ERR, ss.str());

    }
}
